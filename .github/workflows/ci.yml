name: ci

on:
  push:
    # Dependabot's branches are checked by their pull request's run; a run of their push as well
    # would only double it.
    branches-ignore:
      - 'dependabot/**'
  pull_request:

# Least privilege: CI reads the repository and holds no secrets.
permissions:
  contents: read

# Next.js sends anonymous telemetry to Vercel unless this is set.
env:
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node from mise.toml, so CI and the Mac run the same pinned version.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      # pnpm from package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The integration tests' Postgres 18, with the pinned locale from initdb (ADR-012). A
    # throwaway container, reachable only from this runner's loopback, so it trusts local roles.
    services:
      postgres:
        # 18.6, pushed 2026-11-05: pinned by digest, at least 7 days old like every other tool.
        image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      # The whole history, so diff-cover can compare with origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Lint, with the typed rules
        run: pnpm lint
      # Postgres's documented non-durable settings, for a cluster thrown away with the job. Every
      # DROP DATABASE forces an immediate checkpoint, and the harness's template copies leave
      # thousands of dirty buffers, so on the runner's disk one checkpoint took 7.5 s and timed
      # tests out. Nothing a test checks depends on a crash-safe disk.
      - name: The test cluster, non-durable
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: >-
          psql -X -v ON_ERROR_STOP=1 -d postgres
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "SELECT pg_reload_conf()"
      - name: The development and test databases
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: bash scripts/dev-db.sh
      - name: Tests, with coverage
        env:
          # The service's superuser, for the runner's test that a superuser can't migrate.
          INSTANTE_TEST_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
        run: pnpm test:coverage
      - name: Install diff-cover, every package pinned
        run: |
          python3 -m venv "$RUNNER_TEMP/diff-cover"
          "$RUNNER_TEMP/diff-cover/bin/pip" install --no-deps -r .github/diff-cover-requirements.txt
      # CONSTRAINTS.md: changed lines in the fixed scope at least 80% covered.
      - name: Changed lines at least 80% covered
        run: |
          "$RUNNER_TEMP/diff-cover/bin/diff-cover" coverage/lcov.info \
            --compare-branch=origin/main --fail-under=80

  guards:
    name: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The whole history, so the guards can find the merge base with origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Floor guard
        run: pnpm floor-guard
      - name: Commits authored as the owner, no trailers
        run: pnpm check:commits
      - name: Agent settings
        run: pnpm check:agent-settings

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's gitleaks_8.30.1_checksums.txt, for linux_x64.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, checksum checked
        run: |
          set -euo pipefail
          bash scripts/ci/fetch-checked.sh \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Scans the commits this push or pull request adds, as gitleaks' own action does.
      # The first commits were scanned before they were pushed; one of them holds a
      # reworded false positive that a whole-history scan would flag on every run.
      - name: Scan the new commits, values redacted
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$(bash scripts/ci/scan-base.sh)"
          echo "Scanning ${base}..HEAD"
          gitleaks git --redact --no-banner --log-opts="${base}..HEAD" .

  # ShellCheck at the Mac's version: the runner's own is apt's 0.9.0, which misses checks
  # 0.10 and 0.11 added.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: 0.11.0
      # GitHub's SHA-256 of the release's shellcheck-v0.11.0.linux.x86_64.tar.xz: the release
      # publishes no checksum file of its own.
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck, checksum checked
        run: |
          set -euo pipefail
          bash scripts/ci/fetch-checked.sh \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            "$SHELLCHECK_SHA256" "$RUNNER_TEMP/shellcheck.tar.xz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/bin" --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$RUNNER_TEMP/bin/shellcheck" --version | grep -qx "version: ${SHELLCHECK_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Every shell script in scripts/
        run: bash scripts/ci/shellcheck.sh

  # The dependency bar (CONSTRAINTS.md): nothing at high or above, judged by scripts/check-osv.ts.
  # osv-weekly.yml runs the same scan every week, for advisories published since.
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node, for the gate; it imports nothing but Node's own modules, so nothing is installed.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Install osv-scanner, checksum checked
        run: bash scripts/ci/install-osv-scanner.sh
      - name: Nothing at high or above
        run: bash scripts/ci/osv-scan.sh "$RUNNER_TEMP/osv.json"

  # The code bar (CONSTRAINTS.md): no new ERROR findings from Semgrep's registry rules.
  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # 1.183.0, pushed 2026-10-29: the multi-arch image, pinned by digest, which fixes Semgrep
      # and its Python packages together.
      SEMGREP_IMAGE: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
    steps:
      # The whole history, so Semgrep can scan the base commit for what was there already.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: New ERROR findings since the base, no metrics
        env:
          BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/semgrep.sh
