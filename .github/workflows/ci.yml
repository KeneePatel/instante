name: ci

on:
  push:
  pull_request:

# Least privilege: CI reads the repository and holds no secrets.
permissions:
  contents: read

# Next.js sends anonymous telemetry to Vercel unless this is set.
env:
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node from mise.toml, so CI and the Mac run the same pinned version.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      # pnpm from package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The integration tests' Postgres 18, with the pinned locale from initdb (ADR-012). A
    # throwaway container, reachable only from this runner's loopback, so it trusts local roles.
    services:
      postgres:
        # 18.6, pushed 2026-11-05: pinned by digest, at least 7 days old like every other tool.
        image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s
          --health-retries 30
    steps:
      # The whole history, so diff-cover can compare with origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Lint, with the typed rules
        run: pnpm lint
      # Postgres's documented non-durable settings, for a cluster thrown away with the job. Every
      # DROP DATABASE forces an immediate checkpoint, and the harness's template copies leave
      # thousands of dirty buffers, so on the runner's disk one checkpoint took 7.5 s and timed
      # tests out. Nothing a test checks depends on a crash-safe disk.
      - name: The test cluster, non-durable
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: >-
          psql -X -v ON_ERROR_STOP=1 -d postgres
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "SELECT pg_reload_conf()"
      - name: The development and test databases
        env:
          PGHOST: localhost
          PGUSER: postgres
        run: bash scripts/dev-db.sh
      - name: Tests, with coverage
        env:
          # The service's superuser, for the runner's test that a superuser can't migrate.
          INSTANTE_TEST_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
        run: pnpm test:coverage
      - name: Install diff-cover, every package pinned
        run: |
          python3 -m venv "$RUNNER_TEMP/diff-cover"
          "$RUNNER_TEMP/diff-cover/bin/pip" install --no-deps -r .github/diff-cover-requirements.txt
      # CONSTRAINTS.md: changed lines in the fixed scope at least 80% covered.
      - name: Changed lines at least 80% covered
        run: |
          "$RUNNER_TEMP/diff-cover/bin/diff-cover" coverage/lcov.info \
            --compare-branch=origin/main --fail-under=80

  guards:
    name: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The whole history, so the guards can find the merge base with origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Floor guard
        run: pnpm floor-guard
      - name: Commits authored as the owner, no trailers
        run: pnpm check:commits
      - name: Agent settings
        run: pnpm check:agent-settings

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's gitleaks_8.30.1_checksums.txt, for linux_x64.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, checksum checked
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p bin
          tar -xzf gitleaks.tar.gz -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Scans the commits this push or pull request adds, as gitleaks' own action does.
      # The first commits were scanned before they were pushed; one of them holds a
      # reworded false positive that a whole-history scan would flag on every run.
      - name: Scan the new commits, values redacted
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          else
            range="$(git merge-base origin/main HEAD)..HEAD"
          fi
          echo "Scanning $range"
          gitleaks git --redact --no-banner --log-opts="$range" .
