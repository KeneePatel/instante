name: ci

on:
  push:
  pull_request:

# Least privilege: CI reads the repository and holds no secrets.
permissions:
  contents: read

# Next.js sends anonymous telemetry to Vercel unless this is set.
env:
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node from mise.toml, so CI and the Mac run the same pinned version.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      # pnpm from package.json's packageManager field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Lint, with the typed rules
        run: pnpm lint
      - name: Tests
        run: pnpm test

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's gitleaks_8.30.1_checksums.txt, for linux_x64.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, checksum checked
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p bin
          tar -xzf gitleaks.tar.gz -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Scans the commits this push or pull request adds, as gitleaks' own action does.
      # The first commits were scanned before they were pushed; one of them holds a
      # reworded false positive that a whole-history scan would flag on every run.
      - name: Scan the new commits, values redacted
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          else
            range="$(git merge-base origin/main HEAD)..HEAD"
          fi
          echo "Scanning $range"
          gitleaks git --redact --no-banner --log-opts="$range" .
